<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#2563eb" />
        <title>Offline - Budgeting App</title>
        <style>
            :root {
                --bg: #ffffff;
                --fg: #0f172a;
                --muted: #64748b;
                --primary: #2563eb;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0b1220;
                    --fg: #e2e8f0;
                    --muted: #94a3b8;
                    --primary: #3b82f6;
                }
            }
            body {
                margin: 0;
                min-height: 100dvh;
                display: grid;
                place-items: center;
                background: var(--bg);
                color: var(--fg);
                font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
                text-align: center;
                padding: 16px;
            }
            img {
                width: 72px;
                height: 72px;
                border-radius: 16px;
            }
            h1 {
                font-size: 20px;
                margin: 16px 0 8px;
            }
            p {
                color: var(--muted);
                margin: 0 0 20px;
                max-width: 320px;
            }
            button {
                background: var(--primary);
                color: #fff;
                border: 0;
                border-radius: 12px;
                padding: 12px 20px;
                font: inherit;
                font-weight: 600;
                min-height: 44px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="" />
            <h1>Sedang offline</h1>
            <p>
                Periksa koneksi internet, lalu coba lagi. Data keuangan selalu
                diambil langsung dari server agar angkanya akurat.
            </p>
            <button type="button" onclick="location.reload()">Coba lagi</button>
        </main>
    </body>
</html>
